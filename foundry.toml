[profile.default]
src = "contracts"
test = "test/foundry"
out = "forge-out"
cache_path = "forge-cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
